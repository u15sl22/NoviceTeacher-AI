services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pedago_loop
      POSTGRES_USER: pedago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pedago}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pedago_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedago -d pedago_loop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pedago_data:
